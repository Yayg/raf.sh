name: Build Docker Image

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout kamos-ansible
        uses: actions/checkout@v4
        with:
          repository: Yayg/kamos-ansible
          token: ${{ secrets.KAMOS_ANSIBLE_PAT }}

      - name: Pin raf-sh deployment to this build's image
        run: |
          SHORT_TAG="sha-$(echo "${{ github.sha }}" | cut -c1-7)"
          sed -i "s#image: ghcr.io/yayg/raf.sh:.*#image: ghcr.io/yayg/raf.sh:${SHORT_TAG}#" argocd/raf-sh/deployment.yaml
          git config user.name "raf-sh-ci"
          git config user.email "4986194+Yayg@users.noreply.github.com"
          if git diff --quiet; then
            echo "Already pinned to ${SHORT_TAG}, nothing to do"
            exit 0
          fi
          git commit -am "raf-sh: deploy ${SHORT_TAG}"
          git push
