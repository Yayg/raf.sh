{{ define "main" }}
<article>
  <h1>{{ .Title }}</h1>
  {{ if not .Date.IsZero }}
  <p class="post-meta">
    {{ .Date | time.Format ":date_medium" }}
    {{ with .Params.tags }}
      {{ $tags := where . "!=" "untagged" }}
      {{ with $tags }} &middot; {{ delimit . ", " }}{{ end }}
    {{ end }}
  </p>
  {{ end }}
  {{ .Content }}
</article>
{{ end }}
